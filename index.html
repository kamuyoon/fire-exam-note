/* ================= 승인제 잠금 · 비공개 콘텐츠 ================= */
// 문제·해설·이미지는 공개 사이트에 없고, 승인된 회원만 서버에서 받아온다.
const ME={m:LS.get('fx_member',null),loading:false,err:''};   // {status,is_admin,email}
const CONTENT={loaded:false,at:''};
const ADMIN={pending:0};
function gateState(){
  if(!SB_URL)return 'noserver';
  if(!uidOf())return 'login';
  if(!ME.m)return 'checking';
  if(ME.m.status==='pending')return 'pending';
  if(ME.m.status!=='approved')return 'rejected';
  if(!CONTENT.loaded)return 'content';
  return null;
}
async function loadMember(){
  if(!uidOf())return;
  ME.loading=true;
  try{
    const rows=await rest('GET',`fx_members?select=status,is_admin,email&user_id=eq.${uidOf()}`);
    ME.m=rows&&rows[0]?rows[0]:{status:'pending',is_admin:false,email:AUTH.s.user.email};
    LS.set('fx_member',ME.m);ME.err='';
  }catch(e){ME.err='서버에 연결할 수 없습니다'}
  ME.loading=false;
}
function applyContent(d,at){
  window.EXAM_DATA=d;CONTENT.loaded=true;CONTENT.at=at||'';buildData();
}
function loadCachedContent(){
  if(!ME.m||ME.m.status!=='approved')return;
  const c=LS.get('fx_content',null);
  if(c&&c.data&&c.uid===uidOf())applyContent(c.data,c.at);
}
async function loadContent(){
  try{
    const head=await rest('GET','fx_content?select=updated_at&id=eq.exam');
    const at=head&&head[0]&&head[0].updated_at;
    if(!at){if(!CONTENT.loaded){window.EXAM_DATA={subjects:[],exams:[],schedule:[]};CONTENT.loaded=true;buildData()}return}
    if(CONTENT.loaded&&CONTENT.at===at)return;
    const rows=await rest('GET','fx_content?select=data,updated_at&id=eq.exam');
    if(rows&&rows[0]){applyContent(rows[0].data,rows[0].updated_at);LS.set('fx_content',{uid:uidOf(),at:rows[0].updated_at,data:rows[0].data})}
  }catch(e){ME.err='문제 데이터를 불러오지 못했습니다'}
}
async function loadPendingCount(){
  if(!ME.m||!ME.m.is_admin)return;
  try{const r=await rest('GET','fx_members?select=user_id&status=eq.pending');ADMIN.pending=(r||[]).length}catch(e){}
}
async function bootAuth(){
  if(!SB_URL||!uidOf()){render(false);return}
  loadCachedContent();render(false);
  await loadMember();
  if(ME.m&&ME.m.status==='approved'){
    await loadContent();
    syncNow();loadPendingCount().then(()=>{if(ADMIN.pending&&pageOf(location.hash)==='home')rerender()});
  }
  render(true);
}
/* 비공개 이미지: 로그인 토큰으로 받아서 기기에 캐시 */
const IMGMEM={};
async function blobImg(p){
  if(IMGMEM[p])return IMGMEM[p];
  const key=String(p).replace(/^images\//,''),ck=`${location.origin}/fx-img/${encodeURIComponent(key)}`;
  let res=null,c=null;
  try{c=await caches.open('fx-img');res=await c.match(ck)}catch(e){}
  if(!res){
    const tk=await accessToken();
    const r=await fetch(`${SB_URL}/storage/v1/object/authenticated/fx-images/${encodeURIComponent(key)}`,{headers:{apikey:SB_KEY,Authorization:'Bearer '+tk}});
    if(!r.ok)throw new Error('img '+r.status);
    if(c)try{await c.put(ck,r.clone())}catch(e){}
    res=r;
  }
  const u=URL.createObjectURL(await res.blob());IMGMEM[p]=u;return u;
}
function hydrateImgs(){
  document.querySelectorAll('img[data-src]').forEach(im=>{const p=im.dataset.src;im.removeAttribute('data-src');blobImg(p).then(u=>{im.src=u}).catch(()=>{im.alt='이미지를 불러오지 못했습니다';im.classList.add('imgerr')})});
}
async function cacheAll(btn){
  const ps=uniq(Q.flatMap(q=>q.img?[].concat(q.img):[]));btn.disabled=true;let done=0,fail=0;
  for(let i=0;i<ps.length;i+=6){
    await Promise.all(ps.slice(i,i+6).map(p=>blobImg(p).catch(()=>{fail++})));
    done=Math.min(ps.length,i+6);btn.textContent=`저장 중 ${done}/${ps.length}`;
  }
  btn.textContent=fail?`완료 (실패 ${fail}개)`:'오프라인 저장 완료';
}
/* 잠금 화면 */
let GATEMODE='login';
function gatePage(g){
  const brand=`<div class="gate-brand"><img src="icon-192.png" alt=""><h1>소방 기출노트</h1><p>소방 공채 기출 · 오답노트 · 회독</p></div>`;
  if(g==='noserver')return `<div class="gate">${brand}<div class="gate-card"><p class="muted">서버 설정이 필요합니다</p></div></div>`;
  if(g==='login'){
    const su=GATEMODE==='signup';
    return `<div class="gate">${brand}<div class="gate-card">
      <div class="gate-tabs"><button class="${su?'':'on'}" onclick="GATEMODE='login';rerender()">로그인</button><button class="${su?'on':''}" onclick="GATEMODE='signup';rerender()">회원가입</button></div>
      <form onsubmit="doLogin(event,'${su?'signup':'login'}')">
        <label class="field">이메일<input id="lgem" type="email" autocomplete="email" inputmode="email" required></label>
        <label class="field">비밀번호<input id="lgpw" type="password" autocomplete="${su?'new-password':'current-password'}" minlength="6" required placeholder="6자 이상"></label>
        <button class="btn full" type="submit">${su?'가입 신청':'로그인'}</button>
      </form>
      ${su?'<p class="gate-note">가입 후 관리자가 승인하면 이용할 수 있어요.</p>':''}
      <div class="msg" id="lgmsg"></div></div></div>`;
  }
  if(g==='checking'||g==='content')return `<div class="gate">${brand}<div class="gate-card"><div class="spin"></div><p class="muted" style="text-align:center">${ME.err||(g==='checking'?'계정 확인 중...':'문제 불러오는 중...')}</p>${ME.err?`<button class="btn full" onclick="bootAuth()">다시 시도</button>`:''}</div></div>`;
  const email=esc(AUTH.s&&AUTH.s.user.email||'');
  if(g==='pending')return `<div class="gate">${brand}<div class="gate-card"><h3>승인 대기 중</h3><p class="muted">${email}<br>관리자가 승인하면 바로 이용할 수 있어요.</p><button class="btn full" onclick="ME.m=null;bootAuth()">승인 확인</button><button class="gate-link" onclick="doLogout(true)">로그아웃</button></div></div>`;
  return `<div class="gate">${brand}<div class="gate-card"><h3>이용 권한이 없습니다</h3><p class="muted">${email}<br>관리자에게 문의해 주세요.</p><button class="gate-link" onclick="doLogout(true)">로그아웃</button></div></div>`;
}
/* 관리자: 회원 승인 · 콘텐츠 업로드 */
function adminCards(){
  if(!ME.m||!ME.m.is_admin)return '';
  return `<div class="card"><h4>회원 관리 ${ADMIN.pending?`<span class="badge">${ADMIN.pending}</span>`:''}</h4><div id="mlist"><p class="muted" style="font-size:14px;margin:0">불러오는 중...</p></div></div>
  <div class="card"><h4>문제·해설 업로드 (관리자)</h4><p class="muted" style="margin:0 0 12px;font-size:13.5px;line-height:1.6">PC의 <b>fire-exam/private</b> 폴더를 통째로 선택하세요. exam.json과 images 폴더가 서버로 올라가고, 승인된 회원 기기에 자동 반영됩니다.</p>
    <span class="pill filebtn">폴더 선택해서 업로드<input type="file" webkitdirectory directory multiple onchange="uploadContent(this)"></span><div class="msg" id="upmsg"></div>
    <p class="muted" style="margin:12px 0 0;font-size:13px">현재: 회차 ${D.exams.length} · 문제 ${Q.length}${CONTENT.at?` · ${new Date(CONTENT.at).toLocaleString('ko-KR')}`:''}</p></div>`;
}
async function loadMembers(){
  const el=document.getElementById('mlist');if(!el)return;
  try{
    const rows=await rest('GET','fx_members?select=user_id,email,status,is_admin,created_at&order=created_at.desc');
    ADMIN.pending=rows.filter(r=>r.status==='pending').length;
    const lab={pending:'대기',approved:'승인',rejected:'거절'};
    el.innerHTML=rows.length?rows.map(r=>`<div class="mrow"><div><b>${esc(r.email)}</b><small>${mdK(new Date(r.created_at).getTime())} 가입 · <span class="st ${r.status}">${r.is_admin?'관리자':lab[r.status]}</span></small></div>${r.is_admin?'':`<div class="mbtn">${r.status!=='approved'?`<button class="pill sm" onclick="setMember('${r.user_id}','approved')">승인</button>`:''}${r.status!=='rejected'?`<button class="pill sm r" onclick="setMember('${r.user_id}','rejected')">${r.status==='approved'?'해제':'거절'}</button>`:''}</div>`}</div>`).join(''):'<p class="muted">회원이 없습니다</p>';
  }catch(e){el.innerHTML='<p class="muted">불러오지 못했습니다</p>'}
}
async function setMember(uid,st){
  try{await rest('POST','rpc/fx_set_member',{p_user:uid,p_status:st});loadMembers()}catch(e){alert('변경 실패')}
}
async function uploadContent(input){
  const files=[...input.files];input.value='';
  const ej=files.find(f=>/(^|\/)exam\.json$/.test(f.webkitRelativePath||f.name));
  const imgs=files.filter(f=>/\.(png|jpe?g|webp)$/i.test(f.name));
  if(!ej&&!imgs.length){msg('#upmsg','exam.json 또는 이미지가 없습니다',true);return}
  try{
    const tk=await accessToken();let done=0,fail=0;
    for(let i=0;i<imgs.length;i+=5){
      await Promise.all(imgs.slice(i,i+5).map(f=>fetch(`${SB_URL}/storage/v1/object/fx-images/${encodeURIComponent(f.name)}`,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+tk,'x-upsert':'true','Content-Type':f.type||'image/png'},body:f}).then(r=>{if(!r.ok)fail++}).catch(()=>{fail++})));
      done=Math.min(imgs.length,i+5);msg('#upmsg',`이미지 업로드 ${done}/${imgs.length}`);
    }
    if(ej){
      const data=JSON.parse(await ej.text());
      await rest('POST','fx_content',{id:'exam',data,updated_at:new Date().toISOString()},{Prefer:'resolution=merge-duplicates,return=minimal'});
      await loadContent();
    }
    Object.keys(IMGMEM).forEach(k=>delete IMGMEM[k]);try{await caches.delete('fx-img')}catch(e){}
    msg('#upmsg',`업로드 완료 (이미지 ${imgs.length-fail}개${fail?`, 실패 ${fail}개`:''}${ej?', 문제 데이터 반영':''})`,!!fail);
    rerender();
  }catch(e){msg('#upmsg','업로드 실패: '+e.message,true)}
}
