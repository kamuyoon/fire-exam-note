    {name:'소방시설법',w:22,n:'5~6',codes:['FL-04'],pt:'기술기준, 점검·유지관리, 벌칙'},
    {name:'화재예방법',w:18,n:'4~5',codes:['FL-03'],pt:'안전진단, 소방대상물 관리'},
    {name:'소방시설공사업법',w:18,n:'4~5',codes:['FL-05'],pt:'등록·서류, 공사 절차·벌칙'},
    {name:'위험물안전관리법',w:20,n:'4~6',codes:['FL-06'],pt:'저장·취급 기준, 허가·교육'},
    {name:'화재조사법 등',w:8,n:'1~2',codes:['FL-02'],pt:'장비·절차 (변동 큼)'},
  ],
  AL:[
    {name:'서론·일반원칙',w:10,n:'2~3',codes:['AL-01'],pt:'법치행정, 신뢰보호, 비례원칙'},
    {name:'행정작용법',w:32,n:'7~9',codes:['AL-02','AL-03-01'],pt:'행정행위(효력·하자·취소), 입법·계획·지도, 행정절차법'},
    {name:'실효성 확보수단',w:20,n:'4~6',codes:['AL-04'],pt:'대집행, 이행강제금, 직접·즉시강제'},
    {name:'행정구제·쟁송',w:24,n:'5~7',codes:['AL-06'],pt:'취소소송(대상·원고적격·소의이익), 행정심판'},
    {name:'손해전보',w:10,n:'2~3',codes:['AL-05'],pt:'국가배상(제2·5·6조), 손실보상'},
    {name:'기타(정보공개 등)',w:4,n:'1~2',codes:['AL-03-02','AL-03-03'],pt:'조문 중심 소수 출제'},
  ],
};
const areaKey=(sub,i)=>`${sub}:${i}`;
function areaOf(q){const L=AREAS[q.subject]||[];const i=L.findIndex(a=>a.codes.some(c=>hasCode(q,c)));return i<0?null:i}
function areaQs(key){const [sub,i]=key.split(':');const a=(AREAS[sub]||[])[+i];return a?Q.filter(q=>q.subject===sub&&a.codes.some(c=>hasCode(q,c))):[]}
function areaName(key){const [sub,i]=key.split(':');const a=(AREAS[sub]||[])[+i];return a?a.name:key}
// 영역별 통계: 오답률 × 출제비중 = 회당 예상 실점(문항)
function focusRows(sub,ansMap){
  const nq=25;
  return (AREAS[sub]||[]).map((a,i)=>{
    const key=areaKey(sub,i),qs=areaQs(key);
    let n=0,ok=0;
    if(ansMap){qs.forEach(q=>{if(q.id in ansMap){n++;if(answers(q).includes(+ansMap[q.id]))ok++}})}
    else{const g=agg(qs);n=g.n;ok=g.ok}
    const wr=n?(n-ok)/n:0,loss=nq*a.w/100*wr;
    return{a,i,key,qs,n,ok,wr,loss};
  });
}
function focusCards(rows){
  const tried=rows.filter(r=>r.n);
  const sorted=[...tried].sort((x,y)=>y.loss-x.loss||y.a.w-x.a.w).concat(rows.filter(r=>!r.n).sort((x,y)=>y.a.w-x.a.w));
  return sorted.map(r=>`<div class="wrow"><div class="wname">${esc(r.a.name)}<small>${r.a.n}문항 출제</small></div><div>
    <div class="whead">${r.n?`${r.n}문제 중 ${r.ok}개 맞춤`:`미풀이 · 기출 ${r.qs.length}문항`}<a href="#group/area/${enc(r.key)}">자세히 보기</a></div>
    <div class="bl"><span>오답률</span><div class="track">${r.n?`<div class="fill red ${r.wr?'':'zero'}" style="width:${r.wr*100}%">${pct(r.wr,1)}</div>`:''}</div></div>
    <div class="bl"><span>출제비중</span><div class="track"><div class="fill green" style="width:${r.a.w/36*100}%">${r.a.w}%</div></div></div>
    ${r.n&&r.loss>=.05?`<p class="loss">회당 예상 실점 약 <b>${(r.loss).toFixed(1)}문항</b> (−${Math.round(r.loss*2*10)/10}점)</p>`:''}
    <p class="pt">${esc(r.a.pt)}</p></div></div>`).join('');
}
function focusTop(rows,title){
  const top=rows.filter(r=>r.n&&r.wr>0).sort((x,y)=>y.loss-x.loss).slice(0,3);
  if(!top.length)return '';
  const total=rows.reduce((s,r)=>s+r.loss,0);
  return `<div class="card focus"><h4>${title}</h4>${top.map((r,k)=>`<a class="fz" href="#group/area/${enc(r.key)}"><span class="rk">${k+1}</span><div><b>${esc(r.a.name)}</b><small>출제 ${r.a.w}% · 오답률 ${pct(r.wr)} · ${esc(r.a.pt)}</small></div><em>−${Math.round(r.loss*2*10)/10}점</em></a>`).join('')}
    <p class="muted" style="font-size:12.5px;margin:10px 0 0">현재 오답률이 그대로면 회당 약 ${Math.round(total*2)}점을 잃는 셈이에요. 위 순서대로 줄이면 점수가 가장 빨리 올라요.</p></div>`;
}

/* ================= 스와이프로 문제 넘기기 / 안 푼 문제 안내 ================= */
let NAVDIR=0,SWIPED=false;
function goIdx(sid,ni,dir){
  QV.hl=0;
  const s=S.sessions[sid];if(!s)return;
  if(ni>=s.ids.length){finishPrompt(sid);return}
  if(ni<0)return;
  NAVDIR=dir||Math.sign(ni-s.idx);s.idx=ni;s.updated=now();save();render(false);
}
function bindSwipe(sid){
  const el=document.querySelector('.qwrap');if(!el)return;
  let x0=0,y0=0,dx=0,on=false,lock=null,moved=false;
  const reset=()=>{el.style.transition='transform .2s ease-out';el.style.transform=''};
  el.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;if(e.target.closest('textarea,input'))return;on=true;moved=false;lock=null;dx=0;x0=e.clientX;y0=e.clientY;el.style.transition='none'});
  el.addEventListener('pointermove',e=>{
    if(!on)return;const mx=e.clientX-x0,my=e.clientY-y0;
    if(lock===null&&(Math.abs(mx)>10||Math.abs(my)>10))lock=Math.abs(mx)>Math.abs(my)*1.2?'x':'y';
    if(lock!=='x')return;
    moved=true;const s=S.sessions[sid];
    const edge=(mx>0&&s.idx===0);dx=edge?mx*.25:mx;
    el.style.transform=`translateX(${dx}px)`;
  });
  const end=()=>{
    if(!on)return;on=false;
    if(lock!=='x'){return}
    const s=S.sessions[sid];
    if(Math.abs(dx)>70){
      const d=dx<0?1:-1,ni=s.idx+d;
      if(ni<0){reset();return}
      if(ni>=s.ids.length){reset();finishPrompt(sid);return}
      el.style.transition='transform .15s ease-in';
      el.style.transform=`translateX(${dx<0?-100:100}%)`;
      SWIPED=true;setTimeout(()=>goIdx(sid,ni,d),140);
    }else reset();
  };
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',()=>{on=false;reset()});el.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')end()});
  el.addEventListener('click',e=>{if(moved){e.preventDefault();e.stopPropagation();moved=false}},true);
  // 키보드·버튼으로 넘길 땐 애니메이션 없이 바로 교체 (깜빡임 없음)
  if(NAVDIR&&SWIPED){
    el.style.transition='none';el.style.transform=`translateX(${NAVDIR*100}%)`;
    void el.offsetWidth;
    el.style.transition='transform .2s cubic-bezier(.2,.8,.2,1)';el.style.transform='';
  }
  NAVDIR=0;SWIPED=false;
}
function unanswered(s){return s.ids.map((id,i)=>s.ans[id]==null?i:-1).filter(i=>i>=0)}
function finishPrompt(sid){
  const s=S.sessions[sid];if(!s)return;
  if(s.done){location.hash='result/'+sid;return}
  const left=unanswered(s);
  if(!left.length){finish(sid,true);return}
  closeSheet();
  const d=document.createElement('div');d.className='sheet-bg';d.id='sheet';
  d.innerHTML=`<div class="sheet"><h3>아직 안 푼 문제가 ${left.length}개 있어요</h3><p class="muted">번호를 누르면 바로 그 문제로 이동해요</p>
    <div class="sheet-nums">${left.map(i=>`<button onclick="closeSheet();goIdx('${sid}',${i})">${i+1}번</button>`).join('')}</div>
    <button class="btn full" onclick="closeSheet();goIdx('${sid}',${left[0]})">${left[0]+1}번부터 풀기</button>
    <button class="sheet-skip" onclick="closeSheet();finish('${sid}',true)">안 푼 문제는 틀린 것으로 하고 끝내기</button></div>`;
  d.addEventListener('click',e=>{if(e.target===d)closeSheet()});
  document.body.appendChild(d);requestAnimationFrame(()=>d.classList.add('on'));
}
function closeSheet(){const d=document.getElementById('sheet');if(d)d.remove()}
window.addEventListener('hashchange',closeSheet);
/* 가로 목록(번호줄·탭)을 마우스로도 끌어서 넘기기 */
document.addEventListener('pointerdown',e=>{
  if(e.pointerType!=='mouse')return;
  const sc=e.target.closest('.qstrip,.tabs,.pills');if(!sc)return;
  const x0=e.clientX,l0=sc.scrollLeft;let mv=false;
  const mm=ev=>{const dx=ev.clientX-x0;if(Math.abs(dx)>5)mv=true;sc.scrollLeft=l0-dx};
  const up=()=>{document.removeEventListener('pointermove',mm);document.removeEventListener('pointerup',up);if(mv)sc.addEventListener('click',ce=>{ce.preventDefault();ce.stopPropagation()},{capture:true,once:true})};
  document.addEventListener('pointermove',mm);document.addEventListener('pointerup',up);
});

/* ================= 체크 문제 (잘 안 외워지는 문제, 체크 많은 순) ================= */
function checkRanked(sub){
  return Q.filter(q=>S.checks[q.id]&&(!sub||q.subject===sub)).map(q=>({q,k:chkCount(q.id)}))
    .filter(x=>x.k.q||x.k.c).sort((a,b)=>b.k.q-a.k.q||b.k.c-a.k.c||a.q.no-b.q.no);
}
PAGES.checks=(sub='')=>{
  const L=checkRanked(sub);
  let h=hero(topBar('체크 문제')+`<div class="gcap" style="margin-top:4px">잘 안 외워지는 문제 · 문제 체크 많은 순, 같으면 지문 체크 많은 순</div>`+subjPills(sub,k=>`#checks/${k}`),'slim');
  h+=`<div class="card"><div class="sbtns" style="grid-template-columns:1fr 1fr"><button class="btn" ${L.length?'':'disabled'} onclick="startChecks('${sub}',0,false)">체크 문제 모아 풀기<small>${L.length}문항 · 순위순</small></button><button class="btn blue" onclick="location.hash='group/mark/all'">북마크 보기<small>${Q.filter(q=>S.marks[q.id]).length}문항</small></button></div></div>`;

    return `<a class="ck-row" href="javascript:void 0" onclick="startChecks('${sub}',${i},true)"><span class="ck-rk ${i<3?'top':''}">${i+1}</span><div class="ck-m"><b>${esc(qLabel(x.q))}</b><p>${esc(plain(x.q.q))}</p><div class="ck-tags">${x.k.q?`<span class="ck-tag q">문제 ✓${x.k.q}</span>`:''}${cs.map(([n,v])=>`<span class="ck-tag">${NUM[n-1]} ✓${v}</span>`).join('')}</div></div></a>`}).join('')}</div>`;
};
function startChecks(sub,i,temp){
  const ids=checkRanked(sub).map(x=>x.q.id);if(!ids.length)return;
  startSession('check',sub||'all','체크 문제 풀기',ids,{idx:+i,temp:!!temp,short:'체크 문제'});
}

/* ================= 회차별 풀어보기 ================= */
function starSVG(i,score,rate){
  const col=rate>=.8?['#ffb347','#ff6a1a']:rate>=.6?['#ffd36b','#f2a33a']:['#ff7a6b','#c81e12'];
  const gid='fl'+uid();
  return `<svg viewBox="0 0 60 66" aria-label="${i}회차 ${score}점"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col[0]}"/><stop offset="1" stop-color="${col[1]}"/></linearGradient></defs><path d="M30 1C34 13 49 20 49 37a19 19 0 0 1-38 0c0-8 4-14 9-19 1 6 4 10 8 11-2-9 0-19 2-28z" fill="url(#${gid})"/><path d="M30 30c3 5 9 8 9 15a9 9 0 0 1-18 0c0-5 3-8 5-11 1 3 2 4 4 5 0-3 0-6 0-9z" fill="rgba(255,255,255,.22)"/><text x="30" y="47" text-anchor="middle" font-size="14" fill="#fff" font-weight="800">${score}</text><text x="30" y="64" text-anchor="middle" font-size="9" fill="#8b8178" font-weight="700">${i}회차</text></svg>`;
}
function roundsPage(sub){
  sub=sub||D.subjects[0]?.id;
  let h=hero(topBar('회차별로 풀어보기')+pills(D.subjects.filter(s=>EXN[s.id]).map(s=>[s.id,s.name]),sub,k=>`#pick/exam/${k}`),'slim');
  if(!Q.length)return h+noData();
  const live=liveSessions();
  return h+D.exams.filter(e=>groupQs('examsub',`${e.id}~${sub}`).length).map(e=>{
    const key=`${e.id}~${sub}`,rs=S.rounds[key]||[],qs=groupQs('examsub',key),lv=live.find(s=>s.kind==='examsub'&&s.key===key);
    const tag=/가답안/.test(e.name)?'<small>가답안</small>':'';

const STAB=[['focus','집중공략'],['day','일자별'],['exam','회차별'],['subject','과목별'],['chapter','단원별'],['section','세부단원별'],['keyword','키워드별']];
function weakGroups(type,sub){
  const pool=sub?Q.filter(q=>q.subject===sub):Q;
  const keys=type==='chapter'?uniq(pool.flatMap(qChapters)):type==='section'?uniq(pool.flatMap(qSections)):uniq(pool.flatMap(q=>q.keywords));
  return keys.map(k=>{
    const qs=type==='keyword'?pool.filter(q=>q.keywords.includes(k)):pool.filter(q=>hasCode(q,k));
    let w,subj;
    if(type==='chapter'){subj=codeSubject(k);const tot=Q.filter(q=>q.subject===subj).length;w=tot?qs.length/tot:0}
    else if(type==='section'){subj=codeSubject(k);w=qs.length/(EXN[subj]||1)}
    else{const ss=uniq(qs.map(q=>q.subject));subj=ss.length===1?ss[0]:'';w=qs.length/((sub?EXN[sub]:D.exams.length)||1)}
    return{type,key:k,name:type==='keyword'?k:groupName('code',k),subj,qs,a:agg(qs),w};
  });
}
const prio=g=>g.a.n?(g.a.wrong/g.a.n)*g.w+1e-9:-1;
function wcards(gs,sub){
  if(!gs.length)return '<p class="empty">데이터가 없습니다</p>';
  const maxW=Math.max(...gs.map(g=>g.w),1e-9);
  return gs.map(g=>{const a=g.a,wr=a.n?a.wrong/a.n:0;
    const wt=g.type==='chapter'?pct(g.w,1):(Math.round(g.w*10)/10).toString();
    return `<div class="wrow"><div class="wname">${esc(g.name)}${!sub&&g.subj?`<small>${esc(subjShort(g.subj))}</small>`:''}</div><div>
      <div class="whead">${a.n?`${a.n}문제 중 ${a.ok}개 맞춤`:`미풀이 · ${g.qs.length}문항`}<a href="#group/${g.type}/${enc(g.key)}">자세히 보기</a></div>
      <div class="bl"><span>오답률</span><div class="track">${a.n?`<div class="fill red ${wr?'':'zero'}" style="width:${wr*100}%">${pct(wr,1)}</div>`:''}</div></div>
      <div class="bl"><span>${g.type==='chapter'?'출제비중':'출제빈도'}</span><div class="track"><div class="fill green" style="width:${g.w/maxW*100}%">${wt}</div></div></div></div></div>`}).join('');
}

  }

/* 비공개 이미지: 로그인 토큰으로 받아서 기기에 캐시 */
const IMGMEM={};
async function blobImg(p){
  if(IMGMEM[p])return IMGMEM[p];
  const key=String(p).replace(/^images\//,''),ck=`${location.origin}/fx-img/${encodeURIComponent(key)}`;
  let res=null,c=null;
  try{c=await caches.open('fx-img');res=await c.match(ck)}catch(e){}
  if(!res){
    const tk=await accessToken();
    const r=await fetch(`${SB_URL}/storage/v1/object/authenticated/fx-images/${encodeURIComponent(key)}`,{headers:{apikey:SB_KEY,Authorization:'Bearer '+tk}});
    if(!r.ok)throw new Error('img '+r.status);
    if(c)try{await c.put(ck,r.clone())}catch(e){}
    res=r;
  }
  const u=URL.createObjectURL(await res.blob());IMGMEM[p]=u;return u;
}
function hydrateImgs(){
  document.querySelectorAll('img[data-src]').forEach(im=>{const p=im.dataset.src;im.removeAttribute('data-src');blobImg(p).then(u=>{im.src=u}).catch(()=>{im.alt='이미지를 불러오지 못했습니다';im.classList.add('imgerr')})});
}
async function cacheAll(btn){
  const ps=uniq(Q.flatMap(q=>q.img?[].concat(q.img):[]));btn.disabled=true;let done=0,fail=0;
  for(let i=0;i<ps.length;i+=6){
    await Promise.all(ps.slice(i,i+6).map(p=>blobImg(p).catch(()=>{fail++})));
    done=Math.min(ps.length,i+6);btn.textContent=`저장 중 ${done}/${ps.length}`;
  }
  btn.textContent=fail?`완료 (실패 ${fail}개)`:'오프라인 저장 완료';
}

async function uploadLocal(){
  try{
    msg('#upmsg','로컬 파일 읽는 중...');
    const man=await (await fetch('private/manifest.json',{cache:'no-store'})).json();
    const files=[new File([await (await fetch('private/exam.json',{cache:'no-store'})).blob()],'exam.json',{type:'application/json'})];
    for(const n of man.images){const b=await (await fetch('private/images/'+encodeURIComponent(n))).blob();files.push(new File([b],n,{type:'image/png'}))}
    await uploadContent({files,value:''});
  }catch(e){msg('#upmsg','로컬 업로드 실패: '+e.message,true)}
}
async function uploadContent(input){
  const files=[...input.files];input.value='';
  const ej=files.find(f=>/(^|\/)exam\.json$/.test(f.webkitRelativePath||f.name));
  const imgs=files.filter(f=>/\.(png|jpe?g|webp)$/i.test(f.name));
  if(!ej&&!imgs.length){msg('#upmsg','exam.json 또는 이미지가 없습니다',true);return}
  try{
    const tk=await accessToken();let done=0,fail=0;
    for(let i=0;i<imgs.length;i+=5){
      await Promise.all(imgs.slice(i,i+5).map(f=>fetch(`${SB_URL}/storage/v1/object/fx-images/${encodeURIComponent(f.name)}`,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+tk,'x-upsert':'true','Content-Type':f.type||'image/png'},body:f}).then(r=>{if(!r.ok)fail++}).catch(()=>{fail++})));
      done=Math.min(imgs.length,i+5);msg('#upmsg',`이미지 업로드 ${done}/${imgs.length}`);
    }
    if(ej){
      const data=JSON.parse(await ej.text());
      await rest('POST','fx_content',{id:'exam',data,updated_at:new Date().toISOString()},{Prefer:'resolution=merge-duplicates,return=minimal'});
      await loadContent();
    }
    Object.keys(IMGMEM).forEach(k=>delete IMGMEM[k]);try{await caches.delete('fx-img')}catch(e){}
    msg('#upmsg',`업로드 완료 (이미지 ${imgs.length-fail}개${fail?`, 실패 ${fail}개`:''}${ej?', 문제 데이터 반영':''})`,!!fail);
    rerender();
  }catch(e){msg('#upmsg','업로드 실패: '+e.message,true)}
}

function appConfirm(text,o={}){
  const opt=Object.assign({ok:'확인',cancel:'취소',danger:false,title:''},o);
  return new Promise(res=>{
    closeSheet();
    const d=document.createElement('div');d.className='sheet-bg dlg';d.id='sheet';
    d.innerHTML=`<div class="dialog" role="dialog"><div class="dlg-ic ${opt.danger?'danger':''}">${ic(opt.danger?'alert':'fire')}</div>${opt.title?`<h3>${esc(opt.title)}</h3>`:''}<p>${esc(text).replace(/\n/g,'<br>')}</p><div class="dlg-btns">${opt.cancel?`<button class="dbtn ghost" data-v="0">${esc(opt.cancel)}</button>`:''}<button class="dbtn ${opt.danger?'danger':''}" data-v="1">${esc(opt.ok)}</button></div></div>`;
    const done=v=>{d.classList.remove('on');setTimeout(()=>d.remove(),180);res(v)};
    d.addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(b)done(b.dataset.v==='1');else if(e.target===d)done(false)});
    document.body.appendChild(d);requestAnimationFrame(()=>d.classList.add('on'));
  });
}
const appAlert=(t,o={})=>appConfirm(t,Object.assign({cancel:''},o));

function todayQuote(){
  const d=new Date(),doy=Math.floor((d-new Date(d.getFullYear(),0,0))/864e5);
  return QUOTES[(doy*37+d.getFullYear()*11)%QUOTES.length];
}
function quoteLines(t){
  const w=t.split(' ');if(w.length<3)return esc(t);
  let best=1,bd=1e9,acc=0;const total=t.length;
  for(let i=0;i<w.length-1;i++){acc+=w[i].length+1;const d=Math.abs(acc-total/2);if(d<bd){bd=d;best=i+1}}
  return esc(w.slice(0,best).join(' '))+'<br>'+esc(w.slice(best).join(' '));
}
function studyStreak(){
  const days=new Set();Object.values(S.attempts).forEach(a=>a.forEach(x=>days.add(ymd(x.t))));
  let n=0,d=new Date();if(!days.has(ymd(d)))d.setDate(d.getDate()-1);
  while(days.has(ymd(d))){n++;d.setDate(d.getDate()-1)}
  return n;
}
function todayStat(){
  const t=ymd(now());let n=0,ok=0;
  Object.values(S.attempts).forEach(a=>a.forEach(x=>{if(ymd(x.t)===t&&x.src!=='wrong'){n++;if(x.ok)ok++}}));
  return{n,ok};
}

        <div class="q-seal"><span>${esc(k)}</span></div></div>
      <div class="ht-hi"><b>${esc(S.nickname||'수험생')}</b>님, 오늘도 뜨겁게 갑시다</div>
    </header>
    <div class="today"><div><b>${st.n}</b><span>오늘 푼 문제</span></div><div><b>${st.n?pct(st.ok/st.n):'-'}</b><span>오늘 정답률</span></div><div><b>${sk}<small>일</small></b><span>연속 학습</span></div></div>`
  +(ADMIN.pending?`<a class="card inst" href="#settings" style="display:block"><div class="inst-row"><div><b>가입 승인 대기 ${ADMIN.pending}명</b><small>설정 → 회원 관리에서 승인해 주세요</small></div><span class="pill">확인</span></div></a>`:'')
  +(live.length?`<div class="sec">이어서 풀기</div><div class="cont">${live.slice(0,8).map(s=>{const a=answered(s);return `<a class="cc" href="#quiz/${s.id}"><small>${esc(TYPE_LABEL[s.kind]||'풀이')}</small><b>${esc(s.short||s.title)}</b><div class="ccbar"><i style="width:${a/s.ids.length*100}%"></i></div><span>${a} / ${s.ids.length}</span></a>`}).join('')}</div>`:'')
  +`<div class="sec">학습 메뉴</div><div class="sc-grid">${SC.map(([l,h,i,c])=>`<a class="sc" href="${h}"><i class="${c}">${ic(i)}</i><span>${l}</span></a>`).join('')}</div>`
  +installCard(true)
  +(sch.length||S.examDate?`<div class="sec">시험 일정</div><ul class="sched">${S.examDate?`<li><b>내 목표 시험</b><span>${S.examDate}</span></li>`:''}${sch.map(s=>`<li><b>${esc(s.name)}</b><span>${esc(s.date||'미정')}</span></li>`).join('')}</ul>`:'')
  +`<div style="height:24px"></div>`;
};

/* ================= 앱 잠금 퀴즈 (아이폰 단축어 자동화 연동) ================= */
// 단축어 자동화가 인스타·유튜브 등을 열 때 #unlock/<앱> 으로 이 화면을 연다.
// 맞히면 '소방기출 통과' 단축어를 실행 → 통과 시각 기록 + 원래 앱 열기.
const LOCK_APPS={instagram:['인스타그램','instagram://'],youtube:['유튜브','youtube://'],chrome:['크롬','googlechrome://'],naver:['네이버','naversearchapp://'],kakaotalk:['카카오톡','kakaotalk://'],tiktok:['틱톡','tiktok://'],x:['X(트위터)','twitter://'],netflix:['넷플릭스','nflx://']};
const LOCK={app:'',qid:'',chosen:null,tried:0,passed:false};
const lockOn=()=>LS.get('fx_lock_on',true);
function lockPickQ(){
  const pool=Q.filter(q=>q.choices&&!q.choiceImg);
  const wrongs=pool.filter(q=>isWrong(q.id));
  const src=wrongs.length&&Math.random()<.35?wrongs:pool;   // 가끔은 내 오답에서 출제
  let q;do{q=src[Math.floor(Math.random()*src.length)]}while(src.length>1&&q.id===LOCK.qid);
  LOCK.qid=q.id;LOCK.chosen=null;
}
function lockReturn(){
  const sch=(LOCK_APPS[LOCK.app]||['',''])[1];
  if(sch)location.href=sch;else location.hash='home';
}
PAGES.unlock=(app='')=>{
  if(LOCK.app!==app){LOCK.app=app;LOCK.qid='';LOCK.tried=0;LOCK.passed=false}
  const name=(LOCK_APPS[app]||[app||'앱'])[0];
  const head=`<div class="lk-top">${ic('fire')}<b>${esc(name)}</b> 열기 전에 한 문제!</div>`;
  if(!lockOn()||!Q.length){setTimeout(lockReturn,300);return `<div class="lk">${head}<div class="card lk-card"><p class="muted" style="margin:0">앱 잠금 퀴즈가 꺼져 있어요. 바로 돌아갑니다.</p><button class="btn full" style="margin-top:12px" onclick="lockReturn()">${esc(name)}(으)로 돌아가기</button></div></div>`}
  if(LOCK.passed)return `<div class="lk">${head}<div class="card lk-card lk-pass"><div class="lk-ok">${ic('check')}</div><h3>통과! 잘했어요</h3><p class="muted">${LOCK.tried>1?`${LOCK.tried}번째 문제에서 맞혔어요.`:'한 번에 맞혔어요.'} 15분 동안은 다시 묻지 않아요.</p><button class="btn full" onclick="lockReturn()">${esc(name)}(으)로 돌아가기</button></div></div>`;
  if(!LOCK.qid||!QI[LOCK.qid]){lockPickQ();LOCK.tried++}
  const q=QI[LOCK.qid],ans=answers(q),c=LOCK.chosen,rev=c!=null;
  const imgs=q.img?[].concat(q.img).map(x=>`<img class="qimg" data-src="${esc(x)}" alt="">`).join(''):'';
  const rows=q.choices.map((t,i)=>{const n=i+1;let cl='';if(rev){if(ans.includes(n))cl=' correct';else if(c===n)cl=' wrong'}return `<button class="crow${cl}" onclick="lockChoose(${n})"><span class="cn">${NUM[i]}</span><span class="ct">${fmt(t)}</span></button>`}).join('');
  let h=`<div class="lk">${head}<div class="card lk-card"><div class="qsrc">${esc(examName(q.exam))} · ${esc(subjName(q.subject))} ${q.no}번 · ${LOCK.tried}번째 문제</div><h2 class="qtitle"><b>${q.no}</b>${fmt(q.q)}</h2>${imgs}<div class="choices">${rows}</div>`;
  if(rev&&!ans.includes(c))h+=`<div class="verdict no">${ic('x')}오답<span>정답 ${ans.map(a=>NUM[a-1]).join(' ')} · 오답노트에 담았어요</span></div>${q.explain?`<div class="exp">${fmt(q.explain)}</div>`:''}<button class="btn full" style="margin-top:14px" onclick="LOCK.qid='';rerender()">다음 문제 풀기</button>`;
  return h+`</div></div>`;
};
function lockChoose(n){
  if(LOCK.chosen!=null)return;
  const q=QI[LOCK.qid];LOCK.chosen=n;
  const ok=record(q.id,n,'lock');save();
  if(ok){LOCK.passed=true;rerender();setTimeout(lockReturn,1200)}else rerender();
}
function lockCard(){
  const on=lockOn(),base=location.href.split('#')[0];
  const apps=Object.entries(LOCK_APPS).map(([k,[n]])=>`<li><b>${esc(n)}</b> <code>${esc(base)}#unlock/${k}</code></li>`).join('');
  return `<div class="card"><h4>앱 잠금 퀴즈 <span class="muted" style="font-size:12px;font-weight:500">아이폰</span></h4>
    <div class="switch-row" style="margin:4px 0 8px"><span style="flex:1;font-size:14px;color:var(--sub)">인스타·유튜브 등을 열 때 문제를 맞혀야 열리게</span><button class="sw ${on?'on':''}" onclick="LS.set('fx_lock_on',${!on});rerender()" aria-label="앱 잠금 퀴즈"><i></i></button></div>
    <details class="lk-guide"><summary>설정 방법 (자동화 하나만)</summary>
    <ol>
      <li>이 앱을 <b>Safari</b>에서 열고 로그인해 두세요. (문제는 Safari로 열려요)</li>
      <li><b>단축어</b> 앱 → <b>자동화</b> 탭 → <b>+</b> → <b>앱</b> → 잠글 앱(인스타·유튜브 등) 선택 → <b>열려 있음</b> 체크, <b>즉시 실행</b> → <b>다음</b> → <b>새로운 빈 자동화</b></li>
      <li>아래 동작을 순서대로 추가:
        <br>① <b>파일 가져오기</b> — 경로 <code>/fx_pass.txt</code>, <b>찾지 못하면 오류</b> 끄기
        <br>② <b>만약</b> [파일] <b>값이 있음</b>
        <br>&nbsp;&nbsp;&nbsp;③ <b>날짜 사이의 시간 가져오기</b> — [파일] 부터 [현재 날짜] 까지, 단위 <b>분</b>
        <br>&nbsp;&nbsp;&nbsp;④ <b>만약</b> [날짜 사이의 시간] <b>보다 작음</b> 15 → <b>단축어 중단</b>
        <br>⑤ (만약 바깥, 맨 아래) <b>텍스트</b>에 <b>현재 날짜</b> 넣기 → <b>파일 저장</b>: 경로 <code>/fx_pass.txt</code>, 저장 위치 묻기 끄기, <b>덮어쓰기</b> 켜기
        <br>⑥ <b>URL 열기</b> — 아래 앱별 주소
      </li>
      <li>앱마다 자동화를 하나씩 만들고, ⑥의 주소만 그 앱 것으로 바꾸면 돼요.</li>
      <li><b>Safari는 잠그지 마세요</b> (문제 화면이 Safari라 무한 반복돼요). 인터넷을 막고 싶으면 평소 크롬을 쓰고 크롬을 잠그세요.</li>
    </ol>
    <p style="margin:8px 0 4px;font-size:13px;font-weight:700">앱별 주소</p><ul class="lk-apps">${apps}</ul>
    <button class="pill w" style="margin-top:8px" onclick="location.hash='unlock/instagram'">미리 해보기</button></details></div>`;
}

/* ================= boot ================= */
$('#tabbar').innerHTML=[['home','#home','home','홈'],['solve','#solve','edit','문제풀이'],['wrong','#wrong','book','오답노트'],['stats','#stats','chart','통계'],['settings','#settings','gear','설정']]
  .map(([t,h,i,l])=>`<a data-t="${t}" href="${h}">${ic(i)}${l}</a>`).join('');
window.EXAM_DATA=window.EXAM_DATA||{subjects:[],exams:[],schedule:[]};
buildData();
bootAuth();
</script>
</body>
</html>
